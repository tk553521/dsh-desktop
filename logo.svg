<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="orbit" x1="140" y1="140" x2="884" y2="884" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2fb2f2"/>
      <stop offset="0.5" stop-color="#8b76ff"/>
      <stop offset="1" stop-color="#e6339a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.12" r="0.85">
      <stop offset="0" stop-color="#8b76ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#8b76ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.86" cy="0.94" r="0.9">
      <stop offset="0" stop-color="#2fb2f2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#2fb2f2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="960" height="960" rx="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="960" height="960" fill="#07080f"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#glowA)"/>
    <rect x="32" y="32" width="960" height="960" fill="url(#glowB)"/>

    <!-- orbit mark -->
    <g transform="translate(512 512)" fill="none" stroke="url(#orbit)" stroke-linecap="round">
      <ellipse cx="0" cy="0" rx="330" ry="128" stroke-width="46" transform="rotate(-26)"/>
      <ellipse cx="0" cy="0" rx="330" ry="128" stroke-width="46" transform="rotate(34)"/>
      <ellipse cx="0" cy="0" rx="330" ry="128" stroke-width="46" transform="rotate(94)"/>
    </g>
    <circle cx="512" cy="512" r="66" fill="url(#orbit)"/>
    <circle cx="758" cy="318" r="42" fill="#ffffff"/>
  </g>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
</svg>
